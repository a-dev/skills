name: CSS Modules harness

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deterministic-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deterministic audit, setup, schema, migration, and rule tests
        run: npm run css:check
      - name: Validate behavioral evaluation fixtures and offline grader controls
        run: npm run css:eval:fixtures && npm run css:evaluate && npm run css:eval:grader && npm run css:eval:run
      - name: Verify real generated-project scenarios
        run: npm run css:fixture
      - name: Read-only audit check mode
        run: npm run css:audit-fixture

  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Development and production cascade, composition, theme, state, and accessibility fixtures
        run: npm run css:browser
      - name: Prepared behavioral development and production browser routes
        run: npm run css:eval:run -- --browser
